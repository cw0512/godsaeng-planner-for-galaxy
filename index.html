<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>갓생 플래너 - S25+ 모바일 에디션</title>

  <!-- PWA 필수 메타 태그 & 매니페스트 연결 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#070b14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="갓생플래너">
  <link rel="apple-touch-icon" href="./icon-512.png">

  <!-- CDN 의존성 라이브러리 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#070b14',
              900: '#0f172a',
              850: '#162036',
              800: '#1e293b',
              750: '#263449',
              700: '#334155',
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      background-color: #070b14;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .safe-text {
      min-width: 0;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .app-shell {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      background-color: #0f172a;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px calc(88px + env(safe-area-inset-bottom, 0px)) 14px;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid #1e293b;
      z-index: 40;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(99, 102, 241, 0.85); box-shadow: 0 0 12px rgba(99, 102, 241, 0.35); }
      50% { border-color: rgba(16, 185, 129, 0.95); box-shadow: 0 0 18px rgba(16, 185, 129, 0.5); }
    }
    .checkin-glow {
      animation: pulse-border 2s infinite ease-in-out;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body>

  <!-- ================= MOBILE APP SHELL ================= -->
  <div class="app-shell flex flex-col gap-3.5">

    <!-- 1. COMPACT STICKY HEADER -->
    <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md pt-1 pb-2.5 border-b border-slate-800">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-emerald-500 flex items-center justify-center text-white shadow-md shrink-0">
            <i data-lucide="compass" class="w-5 h-5"></i>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h1 class="text-base font-extrabold tracking-tight text-white truncate">갓생 플래너</h1>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800/70 font-bold shrink-0">07~24시</span>
            </div>
            <div class="flex items-center gap-1.5 text-[11px] text-slate-400">
              <span id="liveClock" class="font-mono text-emerald-400 font-semibold">00:00:00</span>
              <span>•</span>
              <span id="streakLabel" class="text-amber-400 font-bold truncate">🔥 연속 0일</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="toggle23Mode()" id="sim23Chip" class="px-2 py-1.5 rounded-lg text-[11px] font-bold bg-slate-800 border border-slate-700 text-slate-300 active:scale-95 transition">
            23시모드
          </button>
          <button onclick="toggleLockOverride()" id="lockOverrideChip" class="px-2 py-1.5 rounded-lg text-[11px] font-bold bg-slate-800 border border-slate-700 text-slate-300 active:scale-95 transition flex items-center gap-1">
            <i data-lucide="wrench" class="w-3 h-3"></i>
            <span>잠금해제</span>
          </button>
        </div>
      </div>

      <div id="lockStatusStrip" class="mt-2 px-2.5 py-1.5 rounded-lg border text-[11px] font-medium flex items-center justify-between gap-2"></div>
    </header>

    <!-- 2. DATE SELECTOR & KPI BAR -->
    <section class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-3 space-y-2.5 shadow-sm">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1.5 bg-slate-900 px-2.5 py-1.5 rounded-xl border border-slate-700 min-w-0 flex-1">
          <i data-lucide="calendar" class="w-3.5 h-3.5 text-indigo-400 shrink-0"></i>
          <input type="date" id="datePicker" onchange="onDateChange()" class="bg-transparent text-xs font-bold text-white focus:outline-none w-full cursor-pointer">
        </div>
        <span id="dayOfWeekBadge" class="text-xs font-bold text-indigo-300 px-2 py-1 rounded-lg bg-indigo-950/60 border border-indigo-800/50 shrink-0">일요일</span>
        <button onclick="goToday()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white active:scale-95 transition shrink-0">
          오늘
        </button>
      </div>

      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-2 min-w-0">
          <div class="text-[10px] text-slate-400">오늘 달성률</div>
          <div id="kpiRate" class="text-sm font-black text-emerald-400 mt-0.5">0%</div>
        </div>
        <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-2 min-w-0">
          <div class="text-[10px] text-slate-400">완료 블록</div>
          <div id="kpiCount" class="text-sm font-black text-indigo-400 mt-0.5">0 / 12</div>
        </div>
        <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-2 min-w-0">
          <div class="text-[10px] text-slate-400">갓생 판정</div>
          <div id="kpiStatus" class="text-xs font-extrabold text-amber-300 mt-1 truncate">진행 중</div>
        </div>
      </div>

      <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-700/60">
        <div id="kpiProgressBar" class="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </section>

    <!-- 3. 23:00 CHECK-IN ALERT BANNER -->
    <div id="checkInBanner" class="p-3 rounded-2xl bg-gradient-to-r from-indigo-950 via-slate-900 to-emerald-950 border border-indigo-500/40 flex items-center justify-between gap-2.5">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center text-indigo-300 shrink-0">
          <i data-lucide="check-square" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0 safe-text">
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-extrabold text-white">23:00 루틴 체크인</span>
            <span id="checkInBadge" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-semibold">대기</span>
          </div>
          <p class="text-[11px] text-slate-300 leading-tight mt-0.5">하루 일과 완수 여부를 체크하고 기록하세요.</p>
        </div>
      </div>
      <button onclick="switchTab('tab-review')" class="px-2.5 py-1.5 rounded-xl bg-indigo-600 text-white text-[11px] font-bold shrink-0 active:scale-95 transition">
        회고쓰기
      </button>
    </div>

    <!-- =================
